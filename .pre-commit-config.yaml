# Mypy is deliberately NOT a pre-commit hook — strict mypy over the 8-package PEP 420 workspace takes several
# seconds and makes commit feel sluggish. Enforced by CI instead. Setup / usage live in AGENTS.md §3.

default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        # Prompts are verbatim opensource ports; trailing whitespace is part of the byte content sent to LLMs.
        exclude: '^packages/.*/prompts/(en|zh)/.*\.py$'
      - id: end-of-file-fixer
        # Same reason: opensource prompt files end without a forced trailing newline.
        exclude: '^packages/.*/prompts/(en|zh)/.*\.py$'
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
