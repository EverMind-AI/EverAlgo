# Pre-commit hooks for EverCore.
#
# Local enforcement of style + lint before commit. The CI pipeline
# (.gitlab-ci.yml) re-runs the same checks as a load-bearing fallback for
# contributors who skip pre-commit or bypass with --no-verify.
#
# Install once after cloning:
#   uv run pre-commit install
#
# Run against all files manually:
#   uv run pre-commit run --all-files
#
# Update pinned versions periodically:
#   uv run pre-commit autoupdate
#
# References:
# - https://pre-commit.com
# - Industrial precedent: sklearn, pydantic, dspy, langchain, pandas, numpy.
#
# Note on mypy: deliberately NOT run as a pre-commit hook. Strict mypy over
# the whole workspace (8 packages, PEP 420 namespace) takes several seconds
# and would make commit feel sluggish; it is enforced by CI instead. Matches
# pydantic / sklearn convention.

default_language_version:
  python: python3.12

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
