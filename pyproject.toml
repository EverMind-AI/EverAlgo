[project]
name = "everalgo-workspace"
version = "0"
description = "EverAlgo monorepo workspace — algorithm library for memory extraction & ranking."
requires-python = ">=3.12"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
everalgo-core = { workspace = true }
everalgo-boundary = { workspace = true }
everalgo-clustering = { workspace = true }
everalgo-rank = { workspace = true }
everalgo-parser = { workspace = true }
everalgo-user-memory = { workspace = true }
everalgo-agent-memory = { workspace = true }
everalgo-knowledge = { workspace = true }

[dependency-groups]
dev = [
  "everalgo-core",
  "everalgo-boundary",
  "everalgo-clustering",
  "everalgo-rank",
  "everalgo-parser",
  "everalgo-user-memory",
  "everalgo-agent-memory",
  "everalgo-knowledge",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.8",
  "mypy>=1.10",
  "pre-commit>=4.0",
  "git-cliff>=2.6",
  "pytest-cov>=7.1.0",
  "pytest-xdist>=3.8.0",
  "diff-cover>=10.2.0",
  "pyright==1.1.409",
]

[tool.ruff]
line-length = 120
extend-exclude = ["opensource"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
  "F", "E", "W",
  "I", "D", "UP",
  "B", "SIM", "C4", "C90", "PIE",
  "N", "TC", "PERF",
  "A", "FBT",
  "G", "LOG", "TRY",
  "RUF",
]
ignore = [
  "D100",
  "D104",
  "D105",
  "D107",
  "E501",
  "TRY003",  # numpy-style detailed exception messages — see ADR-013
]

[tool.ruff.lint.isort]
known-first-party = ["everalgo", "tests"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["D101", "D102", "D103", "D401"]
# Prompts are verbatim opensource ports — keep byte-equivalence: opensource files mix full-width / ASCII
# punctuation (RUF001 / RUF002), retain trailing whitespace + whitespace-only blank lines inside prompt
# strings (W291 / W293), and use ``{{ }}`` braces in template examples.
"**/prompts/zh/**/*.py" = ["RUF001", "RUF002", "W291", "W293"]
"**/prompts/en/**/*.py" = ["RUF001", "RUF002", "W291", "W293"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "packages"]
# `importlib` import-mode is required for PEP 420 namespace packages and prevents
# test subdirectories like `types/` from shadowing stdlib modules.
# https://docs.pytest.org/en/stable/explanation/pythonpath.html
addopts = "-ra --import-mode=importlib"

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
include = ["packages/*/src", "packages/*/tests", "tests"]
exclude = ["opensource", "**/__pycache__", ".venv"]
# pyright's equivalent of mypy's `mypy_path` — required for PEP 420 namespace resolution across the 8 dists.
extraPaths = [
  "packages/everalgo-core/src",
  "packages/everalgo-boundary/src",
  "packages/everalgo-clustering/src",
  "packages/everalgo-rank/src",
  "packages/everalgo-parser/src",
  "packages/everalgo-user-memory/src",
  "packages/everalgo-agent-memory/src",
  "packages/everalgo-knowledge/src",
]
reportImplicitOverride = true
reportOverlappingOverload = false
reportImportCycles = false
reportPrivateUsage = false

[tool.mypy]
python_version = "3.12"
strict = true
namespace_packages = true
explicit_package_bases = true
# Pyright runs over the same tree, so some `# type: ignore` lines are pyright-only and look unused to mypy.
warn_unused_ignores = false
# Vendored opensource reference code (locomo-benchmark / EverOS) is checked into the repo for algorithm
# porting; it is not part of the published distributions and must not block the workspace's strict gate.
exclude = "^opensource/"
# Required for PEP 420 namespace resolution; also disambiguates `everalgo.types` from stdlib `types`.
mypy_path = "packages/everalgo-core/src:packages/everalgo-boundary/src:packages/everalgo-clustering/src:packages/everalgo-rank/src:packages/everalgo-parser/src:packages/everalgo-user-memory/src:packages/everalgo-agent-memory/src:packages/everalgo-knowledge/src"

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false
