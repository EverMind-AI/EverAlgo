# GitLab CI for the EverAlgo monorepo (sub-project 4).
#
# Strict mode: 4 quality gates (ruff check / ruff format --check / mypy /
# pytest) all enforced. The 3 lint jobs run in parallel within the lint
# stage; pytest follows in the test stage. Per-package matrix (only:
# changes:) is deferred to a future sub-project once enough distributions
# have releasable artifacts.

stages:
  - lint
  - test

ruff-check:
  stage: lint
  image: python:3.12-slim
  before_script:
    - pip install --quiet uv
    - uv sync --all-packages --group dev
  script:
    - uv run ruff check .
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

ruff-format:
  stage: lint
  image: python:3.12-slim
  before_script:
    - pip install --quiet uv
    - uv sync --all-packages --group dev
  script:
    - uv run ruff format --check .
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

mypy:
  stage: lint
  image: python:3.12-slim
  before_script:
    - pip install --quiet uv
    - uv sync --all-packages --group dev
  script:
    - uv run mypy .
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# MR title lint: GitLab is configured (Settings -> Merge Requests -> Squash
# commit template = %{title}) so the MR title lands verbatim as the squash
# commit on `main`. This job rejects titles that do not follow the
# Gitmoji + Conventional Commits format defined in AGENTS.md section 6, so
# git-cliff can parse and group release notes from main's commit history.
#
# Implementation uses Python regex (Unicode codepoint classes) instead of
# `grep -E` because POSIX ERE does not honour `\xNN` byte escapes; GNU grep
# treats them as the literal four characters `\`, `x`, `N`, `N`, so the
# emoji-detection prefix always failed in CI. Source: scripts/check_mr_title.py.
mr-title-lint:
  stage: lint
  image: python:3.12-alpine
  script:
    - python3 scripts/check_mr_title.py "$CI_MERGE_REQUEST_TITLE"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

pytest:
  stage: test
  image: python:3.12-slim
  before_script:
    - pip install --quiet uv
    - uv sync --all-packages --group dev
  script:
    - uv run pytest -v
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
