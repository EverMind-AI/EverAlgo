workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

stages:
  - lint
  - test

variables:
  # GitLab's `cache:` can only persist paths inside CI_PROJECT_DIR; default `~/.cache/uv` is outside it.
  UV_CACHE_DIR: "${CI_PROJECT_DIR}/.uv-cache"

default:
  # Non-slim: -slim strips libatomic1 that pyright's bundled Node needs.
  image: ghcr.io/astral-sh/uv:0.9.30-python3.12-bookworm
  interruptible: true
  timeout: 15m

# `--frozen` makes uv error on lockfile drift rather than silently updating it. Bump the image tag to upgrade uv.
.python-job:
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache/
  before_script:
    - uv sync --all-packages --group dev --frozen

ruff-check:
  extends: .python-job
  stage: lint
  script:
    - uv run ruff check .

ruff-format:
  extends: .python-job
  stage: lint
  script:
    - uv run ruff format --check .

mypy:
  extends: .python-job
  stage: lint
  script:
    - uv run mypy .

pyright:
  extends: .python-job
  stage: lint
  script:
    - uv run pyright

pytest:
  extends: .python-job
  stage: test
  needs: []   # DAG: start in parallel with lint stage; pytest does not gate on lint.
  variables:
    GIT_DEPTH: 0   # Full history so diff-cover can compare against the MR target SHA.
  # extends replaces list keys, so uv sync is restated. git is needed by diff-cover (missing from uv image).
  before_script:
    - apt-get update -qq && apt-get install -y --no-install-recommends git
    - uv sync --all-packages --group dev --frozen
  script:
    - uv run pytest -n auto -v
        --junitxml=report.xml
        --cov=everalgo
        --cov-report=term
        --cov-report=xml:coverage.xml
        --cov-fail-under=90
    # Diff-cover only on MR pipelines; CI_MERGE_REQUEST_DIFF_BASE_SHA is empty on main pushes.
    - |
      if [ -n "$CI_MERGE_REQUEST_DIFF_BASE_SHA" ]; then
        uv run diff-cover coverage.xml \
          --compare-branch="$CI_MERGE_REQUEST_DIFF_BASE_SHA" \
          --fail-under=90 \
          --show-uncovered
      fi
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
