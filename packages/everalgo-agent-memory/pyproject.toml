[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "everalgo-agent-memory"
version = "0.2.0"
description = "EverAlgo agent memory: AgentCase / AgentSkill extractors and AgentBoundaryDetector facade."
requires-python = ">=3.12"
license = "MIT"
readme = "README.md"
authors = [{ name = "EverMind", email = "Evermind@shanda.com" }]
keywords = ["llm", "agent-memory", "skill", "case", "everalgo"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "everalgo-core>=0.2.0,<2.0.0",
  "everalgo-boundary>=0.2.0,<2.0.0",
  "everalgo-clustering>=0.2.0,<2.0.0",
]

[project.urls]
Homepage = "https://github.com/EverMind-AI/EverAlgo"
Repository = "https://github.com/EverMind-AI/EverAlgo"
Issues = "https://github.com/EverMind-AI/EverAlgo/issues"
Documentation = "https://github.com/EverMind-AI/EverAlgo/tree/main/packages/everalgo-agent-memory"
Changelog = "https://github.com/EverMind-AI/EverAlgo/blob/main/packages/everalgo-agent-memory/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/everalgo"]
