[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "everalgo-agent-memory"
version = "0.6.0rc2"
description = "EverAlgo agent memory: AgentCase, AgentSkill, and AgentProfile extractors plus the re-exported BoundaryDetector."
requires-python = ">=3.12"
license = "Apache-2.0"
readme = "README.md"
authors = [{ name = "EverMind", email = "Evermind@shanda.com" }]
keywords = ["llm", "agent-memory", "skill", "case", "everalgo"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  # The four extractor facades derive their sync bridges with ``asgiref.sync.async_to_sync``; declare
  # it explicitly rather than relying on the transitive pull-in via everalgo-boundary.
  "asgiref>=3.0",
  "everalgo-core>=0.6.0rc2,<2.0.0",
  "everalgo-boundary>=0.4.0rc1,<2.0.0",
  # Declared without an import on purpose: ``AgentSkill.cluster_id`` binds skills to clusters this
  # package never computes, and the dependency reserves that pairing for callers.
  "everalgo-clustering>=0.3.0rc1,<2.0.0",
  # Reply models and typed inputs import pydantic directly; declare it explicitly
  # rather than relying on the transitive pull-in via everalgo-core.
  "pydantic>=2.7",
]

[project.urls]
Homepage = "https://github.com/EverMind-AI/EverAlgo"
Repository = "https://github.com/EverMind-AI/EverAlgo"
Issues = "https://github.com/EverMind-AI/EverAlgo/issues"
Documentation = "https://github.com/EverMind-AI/EverAlgo/tree/main/packages/everalgo-agent-memory"
Changelog = "https://github.com/EverMind-AI/EverAlgo/blob/main/packages/everalgo-agent-memory/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/everalgo"]
