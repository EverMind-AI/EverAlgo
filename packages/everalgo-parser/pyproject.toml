[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "everalgo-parser"
version = "0.2.0"
description = "EverAlgo parser: multimodal raw-file parsing (image / audio / document / video / url) into ParsedContent."
requires-python = ">=3.12"
license = "Apache-2.0"
readme = "README.md"
authors = [{ name = "EverMind", email = "Evermind@shanda.com" }]
keywords = ["llm", "multimodal", "parsing", "everalgo"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "everalgo-core>=0.2.0,<2.0.0",
  "asgiref>=3.8.0",
  "pillow>=10.0.0",
  "beautifulsoup4>=4.12.0",
  # The URL parser uses httpx directly for ``http``/``https`` fetches; declare
  # explicitly rather than relying on the transitive pull-in via openai SDK.
  "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/EverMind-AI/EverAlgo"
Repository = "https://github.com/EverMind-AI/EverAlgo"
Issues = "https://github.com/EverMind-AI/EverAlgo/issues"
Documentation = "https://github.com/EverMind-AI/EverAlgo/tree/main/packages/everalgo-parser"
Changelog = "https://github.com/EverMind-AI/EverAlgo/blob/main/packages/everalgo-parser/CHANGELOG.md"

[project.optional-dependencies]
# SVG rasterisation; pulled in only when callers parse .svg files.
svg = ["cairosvg>=2.7.0"]
# Office document conversion (docx / xlsx / pptx / ...) requires LibreOffice
# (``soffice``) as a SYSTEM dependency, not a pip package. Install via:
#   Linux: apt install libreoffice
#   macOS: brew install --cask libreoffice
# There is no pip extra for it — the parser shells out at runtime.

[tool.hatch.build.targets.wheel]
packages = ["src/everalgo"]
