[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evercore-agent-memory"
version = "0.1.0"
description = "EverCore agent memory: AgentCase / AgentSkill extractors (re-exports boundary as AgentMemCellExtractor)."
requires-python = ">=3.12"
license = "MIT"
readme = "README.md"
authors = [{ name = "EverMind" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "evercore-core>=0.1.0,<2.0.0",
  "evercore-boundary>=0.1.0,<2.0.0",
  "evercore-clustering>=0.1.0,<2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/evercore"]
