[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "everalgo-clustering"
version = "0.2.0"
description = "EverAlgo clustering: cluster_by_geometry / cluster_by_llm functional operators with Cluster value object."
requires-python = ">=3.12"
license = "Apache-2.0"
readme = "README.md"
authors = [{ name = "EverMind", email = "Evermind@shanda.com" }]
keywords = ["llm", "memory", "clustering", "embeddings", "everalgo"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "everalgo-core>=0.2.0,<2.0.0",
  "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/EverMind-AI/EverAlgo"
Repository = "https://github.com/EverMind-AI/EverAlgo"
Issues = "https://github.com/EverMind-AI/EverAlgo/issues"
Documentation = "https://github.com/EverMind-AI/EverAlgo/tree/main/packages/everalgo-clustering"
Changelog = "https://github.com/EverMind-AI/EverAlgo/blob/main/packages/everalgo-clustering/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/everalgo"]
