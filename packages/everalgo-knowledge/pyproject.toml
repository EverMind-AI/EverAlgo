[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "everalgo-knowledge"
version = "0.2.0"
description = "EverAlgo knowledge: file-based knowledge extractors producing KnowledgeMemory."
requires-python = ">=3.12"
license = "MIT"
readme = "README.md"
authors = [{ name = "EverMind", email = "Evermind@shanda.com" }]
keywords = ["llm", "memory", "knowledge-extraction", "everalgo"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  # Placeholder distribution: every entry point raises NotImplementedError. This classifier makes
  # PyPI reject any upload (https://pypi.org/classifiers/) so the unimplemented package cannot ship
  # by accident while the namespace is reserved.
  "Private :: Do Not Upload",
]
dependencies = [
  "everalgo-core>=0.2.0,<2.0.0",
  "everalgo-parser>=0.2.0,<2.0.0",
]

[project.urls]
Homepage = "https://github.com/EverMind-AI/EverAlgo"
Repository = "https://github.com/EverMind-AI/EverAlgo"
Issues = "https://github.com/EverMind-AI/EverAlgo/issues"
Documentation = "https://github.com/EverMind-AI/EverAlgo/tree/main/packages/everalgo-knowledge"
Changelog = "https://github.com/EverMind-AI/EverAlgo/blob/main/packages/everalgo-knowledge/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/everalgo"]
