[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evercore-core"
version = "0.1.0"
description = "EverCore foundation: types, LLM client + providers, prompt validators, testing helpers."
requires-python = ">=3.12"
license = "MIT"
readme = "README.md"
authors = [{ name = "EverMind" }]
keywords = ["llm", "memory", "algorithm", "evercore"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "openai>=1.0",
  "pydantic>=2.7",
]

# `evercore` here is a PEP 420 namespace; hatchling packages the directory
# tree under `src/evercore/` belonging to this distribution only.
# Reference: https://github.com/pydantic/pydantic-ai/blob/main/pydantic_ai_slim/pyproject.toml
[tool.hatch.build.targets.wheel]
packages = ["src/evercore"]
