[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evercore-parser"
version = "0.1.0"
description = "EverCore parser: multimodal raw-file parsing (image / audio / document / video / url) into ParsedContent."
requires-python = ">=3.12"
license = "MIT"
readme = "README.md"
authors = [{ name = "EverMind" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "evercore-core>=0.1.0,<2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/evercore"]
