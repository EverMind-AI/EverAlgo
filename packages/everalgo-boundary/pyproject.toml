[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "everalgo-boundary"
version = "0.2.0"
description = "EverAlgo boundary: MemCell extractors (chat / workspace / agent)."
requires-python = ">=3.12"
license = "MIT"
readme = "README.md"
authors = [{ name = "EverMind", email = "Evermind@shanda.com" }]
keywords = ["llm", "memory", "boundary-detection", "segmentation", "everalgo"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Internal everalgo-* deps carry a next-major upper bound (`<2.0.0`) for diamond-dependency safety;
# third-party deps use a lower bound only (no upper cap). See docs/version-policy.md for the rationale.
dependencies = [
  "asgiref>=3.0",
  "everalgo-core>=0.2.0,<2.0.0",
]

[project.urls]
Homepage = "https://github.com/EverMind-AI/EverAlgo"
Repository = "https://github.com/EverMind-AI/EverAlgo"
Issues = "https://github.com/EverMind-AI/EverAlgo/issues"
Documentation = "https://github.com/EverMind-AI/EverAlgo/tree/main/packages/everalgo-boundary"
Changelog = "https://github.com/EverMind-AI/EverAlgo/blob/main/packages/everalgo-boundary/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/everalgo"]
