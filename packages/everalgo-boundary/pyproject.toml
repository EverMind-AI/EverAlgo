[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "everalgo-boundary"
version = "0.1.0"
description = "EverAlgo boundary: MemCell extractors (chat / workspace / agent)."
requires-python = ">=3.12"
license = "MIT"
readme = "README.md"
authors = [{ name = "EverMind" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
]
# Loose lower bound + cross-major upper bound, mirroring HuggingFace `transformers`
# pin on `huggingface-hub`. See AGENTS.md §6 (Branching & Commits) for version strategy.
dependencies = [
  "asgiref>=3.0",
  "everalgo-core>=0.1.0,<2.0.0",
]

[project.urls]
Homepage = "https://github.com/EverMind-AI/EverAlgo"
Repository = "https://github.com/EverMind-AI/EverAlgo"
Issues = "https://github.com/EverMind-AI/EverAlgo/issues"
Documentation = "https://github.com/EverMind-AI/EverAlgo/tree/main/packages/everalgo-boundary"
Changelog = "https://github.com/EverMind-AI/EverAlgo/blob/main/packages/everalgo-boundary/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/everalgo"]
