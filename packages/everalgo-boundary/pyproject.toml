[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "everalgo-boundary"
version = "0.1.0"
description = "EverAlgo boundary: MemCell extractors (chat / workspace / agent) + tokenize / split helpers."
requires-python = ">=3.12"
license = "MIT"
readme = "README.md"
authors = [{ name = "EverMind" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
]
# Loose lower bound + cross-major upper bound, mirroring HuggingFace `transformers`
# pin on `huggingface-hub`. See docs/design.md §1.3 line 237 (version strategy).
dependencies = [
  "asgiref>=3.0",
  "everalgo-core>=0.1.0,<2.0.0",
  "tiktoken>=0.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/everalgo"]
