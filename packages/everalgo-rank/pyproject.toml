[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "everalgo-rank"
version = "0.5.0rc1"
description = "EverAlgo rank: composable retrieval strategies and four business rankers over shared fusion, weight, and rerank tools."
requires-python = ">=3.12"
license = "Apache-2.0"
readme = "README.md"
authors = [{ name = "EverMind", email = "Evermind@shanda.com" }]
keywords = ["llm", "memory", "ranking", "retrieval", "reranking", "everalgo"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "asgiref>=3.0",
  "everalgo-core>=0.6.0rc1,<2.0.0",
  # Reply models and typed inputs import pydantic directly; declare it explicitly
  # rather than relying on the transitive pull-in via everalgo-core.
  "pydantic>=2.7",
]

[project.urls]
Homepage = "https://github.com/EverMind-AI/EverAlgo"
Repository = "https://github.com/EverMind-AI/EverAlgo"
Issues = "https://github.com/EverMind-AI/EverAlgo/issues"
Documentation = "https://github.com/EverMind-AI/EverAlgo/tree/main/packages/everalgo-rank"
Changelog = "https://github.com/EverMind-AI/EverAlgo/blob/main/packages/everalgo-rank/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/everalgo"]
